<!-- @dsCard group="Colors" viewport="700x180" name="Semantic pairings" subtitle="The four legal ground/ink combinations" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page)}.sw{display:flex;flex-direction:column;gap:7px}.sw i{display:block;width:56px;height:56px;border-radius:50%}.sw b{font:500 11px/1 var(--font-text);color:var(--raw-stone-mid);letter-spacing:.04em}.sw em{font:500 10px/1 var(--font-text);color:var(--raw-stone-mid);font-style:normal;opacity:.7}.row{display:flex;gap:16px;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="background:var(--surface-canvas);padding:16px;border-radius:8px"><div style="font:600 12px/1.2 var(--font-display);letter-spacing:3px;text-transform:uppercase;color:var(--text-kicker)">Kicker</div><div style="font:500 20px/1.2 var(--font-display-cond);color:var(--text-primary);margin-top:6px">Parchment</div></div>
<div style="background:var(--surface-card);padding:16px;border-radius:8px;box-shadow:var(--shadow-card)"><div style="font:500 12px/1 var(--font-text);letter-spacing:2.5px;text-transform:uppercase;color:var(--text-plan-label)">Plan</div><div style="font:500 20px/1.2 var(--font-display-cond);color:var(--text-primary);margin-top:6px">Card</div></div>
<div style="background:var(--surface-dark);padding:16px;border-radius:8px"><div style="font:500 12px/1 var(--font-text);letter-spacing:3px;text-transform:uppercase;color:var(--text-on-dark-soft)">Label</div><div style="font:500 20px/1.2 var(--font-display-cond);color:var(--text-on-dark);margin-top:6px">Pine</div><div style="font:500 12px/1.4 var(--font-text);color:var(--text-muted-on-dark);margin-top:4px">Muted body</div></div>
<div style="background:var(--surface-ink);padding:16px;border-radius:8px"><div style="font:500 12px/1 var(--font-text);letter-spacing:3px;text-transform:uppercase;color:var(--text-on-dark-soft)">Colors</div><div style="font:500 20px/1.2 var(--font-display-cond);color:var(--text-on-dark);margin-top:6px">Ink</div></div>
</div></body></html>
